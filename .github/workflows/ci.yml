name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Typage (mypy strict)
        run: python -m mypy src

      - name: Tests (pytest)
        run: python -m pytest -q -ra

      - name: Démo synthétique (CLI de bout en bout)
        run: |
          simengineer run --source synthetic --scenario race --no-realtime --null-voice --no-ui
          simengineer analyze
          simengineer report
          simengineer setup diagnose

  windows-install:
    name: Installateur Windows (voix réelles)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"

      - name: Installateur sans intervention
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install_windows.ps1 `
            -Unattended -NoShortcuts -Python "${{ steps.py.outputs.python-path }}"

      - name: Vérifications après installation
        shell: pwsh
        run: |
          $se = ".venv\Scripts\simengineer.exe"
          & $se say-test --synth-only
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .venv\Scripts\python.exe -c "import irsdk, faster_whisper, sounddevice, openai, psutil; print('modules OK')"
          & $se run --source synthetic --scenario clean --no-realtime --null-voice --no-ui --diagnostic
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem $HOME\Desktop\SimEngineer-diagnostic-*.zip, $HOME\SimEngineer-diagnostic-*.zip -ErrorAction SilentlyContinue
